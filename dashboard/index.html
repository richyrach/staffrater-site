<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a server — Staff Rater</title>
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/bot-logo.png">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body class="dashboard-body auth-pending">
<div class="auth-loader" id="auth-loader" aria-live="polite">
  <div class="auth-loader-card"><img src="/assets/bot-logo.png" alt=""><span class="skeleton skeleton-line wide"></span><span class="skeleton skeleton-line"></span></div>
</div>

<div class="dashboard-layout" id="dashboard" hidden>
  <aside class="dash-sidebar">
    <a class="dash-brand" href="/dashboard/">
      <span class="dash-brand-mark"><img src="/assets/bot-logo.png" alt=""><span class="status-dot"></span></span>
      <span><strong>Staff Rater</strong><small>Server operations</small></span>
    </a>
    <nav class="dash-nav" aria-label="Dashboard">
      <a class="dash-nav-item active" href="/dashboard/"><span class="nav-glyph">⌂</span> Servers</a>
    </nav>
    <div class="dash-sidebar-bottom">
      <div class="dash-user" id="dash-user"></div>
      <a class="dash-account" href="/">View product site</a>
      <a class="dash-account" href="/api/logout?redirect=/">Log out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-shell">
      <header class="workspace-header">
        <div><div class="eyebrow">Owner workspace</div><h1 class="dash-title">Choose a server</h1><p class="dash-sub">Only servers you own where Staff Rater is installed appear here.</p></div>
        <a class="btn primary" href="https://discord.com/oauth2/authorize?client_id=1410293903630012508&permissions=8859859864780657&integration_type=0&scope=bot" target="_blank" rel="noreferrer">Add Staff Rater</a>
      </header>

      <div class="server-toolbar" id="server-toolbar" hidden>
        <label class="search-control"><span aria-hidden="true">⌕</span><input id="server-search" type="search" placeholder="Search your servers" autocomplete="off"></label>
        <span class="result-count" id="result-count"></span>
      </div>
      <div id="state" aria-live="polite"></div>
      <div class="server-grid" id="grid" aria-label="Your Staff Rater servers"></div>
    </div>
  </main>
</div>

<script>
(function(){
  const api=(url,options={})=>fetch(url,Object.assign({credentials:"include",cache:"no-store"},options));
  const esc=value=>String(value==null?"":value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  let guilds=[];
  function avatarUrl(user){return user.avatar?`https://cdn.discordapp.com/avatars/${encodeURIComponent(user.id)}/${encodeURIComponent(user.avatar)}.png?size=80`:"/assets/bot-avatar.png"}
  function guildIcon(g){
    if(g.icon)return `<img class="server-avatar" src="https://cdn.discordapp.com/icons/${encodeURIComponent(g.id)}/${encodeURIComponent(g.icon)}.png?size=128" alt="">`;
    const initials=esc((g.name||"?").split(/\s+/).slice(0,2).map(word=>word[0]||"").join("").toUpperCase());
    return `<span class="server-avatar server-initials">${initials}</span>`;
  }
  function memberText(value){return Number.isFinite(Number(value))?`${Number(value).toLocaleString()} member${Number(value)===1?"":"s"}`:"Staff Rater installed"}
  function render(items){
    const grid=document.getElementById("grid");
    document.getElementById("result-count").textContent=`${items.length} server${items.length===1?"":"s"}`;
    if(!items.length){grid.innerHTML="";document.getElementById("state").innerHTML=`<div class="empty-state"><div class="empty-icon">⌕</div><h2>No matching servers</h2><p>Try another search.</p></div>`;return}
    document.getElementById("state").innerHTML="";
    grid.innerHTML=items.map(g=>`<a class="server-card" href="/dashboard/guild.html?guild_id=${encodeURIComponent(g.id)}">
      <span class="server-art">${guildIcon(g)}<span class="server-online" title="Staff Rater is installed"></span></span>
      <span class="server-card-copy"><strong>${esc(g.name)}</strong><small>${esc(memberText(g.members))}</small></span>
      <span class="server-open">Open <span aria-hidden="true">→</span></span>
    </a>`).join("");
  }
  function showEmpty(){document.getElementById("state").innerHTML=`<div class="empty-state large"><div class="empty-icon">＋</div><h2>No shared owner servers yet</h2><p>Staff Rater only lists servers that you own and where the bot is already installed.</p><a class="btn primary" target="_blank" rel="noreferrer" href="https://discord.com/oauth2/authorize?client_id=1410293903630012508&permissions=8859859864780657&integration_type=0&scope=bot">Add it to a server</a></div>`}
  function reveal(data){
    const user=data.user||{};
    document.getElementById("dash-user").innerHTML=`<img src="${esc(avatarUrl(user))}" alt=""><span><b>${esc(user.username||"Discord user")}</b><small>Signed in with Discord</small></span>`;
    document.getElementById("auth-loader").remove();document.getElementById("dashboard").hidden=false;document.body.classList.remove("auth-pending");
  }
  async function main(){
    try{
      const response=await api("/api/servers");
      if(response.status===401){location.replace(`/api/login?return=${encodeURIComponent("/dashboard/")}`);return}
      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.ok)throw new Error(data.error||`HTTP ${response.status}`);
      reveal(data);guilds=data.guilds||[];
      if(!guilds.length){showEmpty();return}
      document.getElementById("server-toolbar").hidden=false;render(guilds);
      document.getElementById("server-search").addEventListener("input",event=>{const query=event.target.value.trim().toLocaleLowerCase();render(guilds.filter(g=>g.name.toLocaleLowerCase().includes(query)))})
    }catch(error){
      document.getElementById("auth-loader").remove();document.getElementById("dashboard").hidden=false;document.body.classList.remove("auth-pending");
      document.getElementById("state").innerHTML=`<div class="error-state"><h2>Couldn’t load your servers</h2><p>${esc(error.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
    }
  }
  main();
})();
</script>
</body>
</html>
