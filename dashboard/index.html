<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your servers — Staff Rater</title>
<meta name="theme-color" content="#ffffff" />
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/bot-logo.png" />
<link rel="stylesheet" href="/assets/site.css" />
<link rel="stylesheet" href="/assets/dashboard.css" />
</head>
<body class="dashboard-body">
<div class="dashboard-layout">
  <aside class="dash-sidebar">
    <a class="dash-brand" href="/dashboard/">
      <span class="dash-brand-mark"><img src="/assets/bot-logo.png" alt=""><span class="status-dot" aria-label="Bot online"></span></span>
      <span><strong>Staff Rater</strong><small>Control center</small></span>
    </a>
    <nav class="dash-nav" aria-label="Dashboard">
      <a class="dash-nav-item active" href="/dashboard/"><span class="nav-glyph">⌂</span> Servers</a>
      <span class="dash-nav-item disabled"><span class="nav-glyph">⚙</span> Settings</span>
      <span class="dash-nav-item disabled"><span class="nav-glyph">♙</span> Staff</span>
      <span class="dash-nav-item disabled"><span class="nav-glyph">↗</span> Analytics</span>
      <span class="dash-nav-item disabled"><span class="nav-glyph">▤</span> Applications</span>
    </nav>
    <div class="dash-sidebar-note">Select a server to unlock its workspace.</div>
    <div class="dash-sidebar-bottom" id="nav-auth">
      <a class="dash-account" href="/api/logout?redirect=/">Log out</a>
    </div>
  </aside>

  <main class="dash-main">
    <div class="dash-shell">
      <div class="dash-head">
        <div>
          <div class="eyebrow">Workspace</div>
          <h1 class="dash-title">Your servers</h1>
          <div class="dash-sub">Choose a community to manage its staff systems.</div>
        </div>
      </div>

      <div id="state"><p class="muted"><span class="spinner"></span> Loading your servers…</p></div>
      <div class="server-grid" id="grid"></div>
    </div>
  </main>
</div>

<script>
(function(){
  // Session is an HttpOnly cookie; just send credentials.
  const api = (u, o={}) => fetch(u, Object.assign({credentials:"include", cache:"no-store"}, o));

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // Discord sends permissions as a decimal STRING larger than 2^31 — 32-bit
  // bitwise ops give wrong answers here, so use BigInt.
  const ADMIN = 1n << 3n, MANAGE_GUILD = 1n << 5n;
  function canManage(g){
    if (g.owner) return true;
    try { return (BigInt(g.permissions ?? 0) & (ADMIN | MANAGE_GUILD)) !== 0n; }
    catch { return false; }
  }

  function iconFor(g){
    if (g.icon) return `<img class="server-avatar" src="https://cdn.discordapp.com/icons/${encodeURIComponent(g.id)}/${encodeURIComponent(g.icon)}.png?size=64" alt="">`;
    const initials = esc((g.name||"?").split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase());
    return `<div class="server-avatar">${initials}</div>`;
  }

  async function main(){
    const state = document.getElementById("state");
    const grid  = document.getElementById("grid");
    let me;
    try {
      const r = await api("/api/me");
      if (r.status === 401) {
        state.innerHTML = `<div class="banner">You're signed out. <a href="/api/login?returnTo=/dashboard/">Sign in with Discord</a> to continue.</div>`;
        return;
      }
      if (!r.ok) throw new Error("HTTP " + r.status);
      me = await r.json();
    } catch (e) {
      state.innerHTML = `<div class="banner err">Couldn't load your servers (${esc(e.message)}). Try reloading.</div>`;
      return;
    }

    const user = me && me.ok && me.session && me.session.user;
    if (user) {
      document.getElementById("nav-auth").innerHTML =
        `<div class="dash-user"><span class="user-dot"></span><span><b>@${esc(user.username)}</b><small>Signed in</small></span></div>
         <a class="dash-account" href="/api/logout?redirect=/">Log out</a>`;
    }

    const guilds = ((me.session && me.session.guilds) || []).filter(canManage);
    if (!guilds.length) {
      state.innerHTML = `<div class="empty">
        You don't manage any servers that Staff Rater can configure.<br>
        <span class="small">You need <b>Manage Server</b> or <b>Administrator</b>.</span>
      </div>`;
      return;
    }

    state.innerHTML = "";
    grid.innerHTML = guilds.map(g => `
      <a class="server-card" href="/dashboard/guild.html?guild_id=${encodeURIComponent(g.id)}">
        ${iconFor(g)}
        <div style="min-width:0">
          <div class="server-name">${esc(g.name)}</div>
          <div class="server-role">${g.owner ? "Owner" : "Manages server"}</div>
        </div>
      </a>`).join("");
  }

  main();
})();
</script>
</body>
</html>
